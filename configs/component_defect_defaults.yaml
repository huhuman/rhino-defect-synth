modeling:
  debug:
    defect_normals:
      enabled: false
      layer: "debug::normal"
      by_type: true
      length: 40.0
      head_length_ratio: 0.25
      head_width_ratio: 0.35
    reference_points:
      enabled: false
      radius_coef: 0.04375
    defect_seeds:
      enabled: true
      layer: "debug::seed"
      by_type: true
      radius_coef: 0.04375
      min_radius: 0.625
      axis_scale: 1.6
  defect:
    enabled: true
    seed: null
    target_layers: ["component::slab", "component::parapet", "component::beam", "component::pier"]
    max_attempts_per_instance: 40
    reference:
      sample_edge_length_u: 100.0
      sample_edge_length_v: 100.0
      boundary_margin_ratio_u: 0.25
      boundary_margin_ratio_v: 0.25
      max_num_surfaces: 0
    surface_subtraction:
      normal_extrude_distance: 8.0
    random:
      orientation_min_deg: 0.0
      orientation_max_deg: 360.0
      boundary_margin: 0.9
      normal_offset: 0.0
    layers:
      geometry:
        crack_cs1: "defect::crack::CS1"
        crack_cs2: "defect::crack::CS2"
        crack_cs3: "defect::crack::CS3"
        efflore_cs2: "defect::efflore::CS2"
        efflore_cs3_inner: "defect::efflore::CS3::inner"
        efflore_cs3_outer: "defect::efflore::CS3::outer"
        spall_cs2: "defect::spalling::CS2"
        spall_cs3: "defect::spalling::CS3"
        exposed_rebar_cs2_spalling: "defect::exposed_rebar::CS2::spalling"
        exposed_rebar_cs2_rebar: "defect::exposed_rebar::CS2::rebar"
        exposed_rebar_cs3_spalling: "defect::exposed_rebar::CS3::spalling"
        exposed_rebar_cs3_rebar: "defect::exposed_rebar::CS3::rebar"
    crack:
      enabled: true
      count: 0
      overview_csv_path: null
      cs_weights: [1, 1, 1]
      t1: 0.03048
      t2: 0.127
      d1_range: [0.05, 0.25]
      delta_depth_range: [1.0, 3.0]
    efflore:
      enabled: true
      count: 0
      overview_csv_path: null
      cs_weights: [1, 1]
      z_threshold: 45.0
      span_range_cm: [30.0, 100.0]
      fixed_thickness: 0.25
    spalling:
      enabled: true
      count: 0
      overview_csv_path: null
      depth_threshold: 2.54
      diameter_threshold: 15.24
      cs_weights: [1, 1]
      depth_irregularity: 0.2
      min_bottom_area_ratio: 0.25
      rebar:
        enabled: true
        place_probability: 0.75
        radius_choices_cm: [0.635, 0.795, 0.955, 1.11, 1.27]
        spacing_choices_cm: [7.62, 10.16, 12.70, 15.24, 20.32, 25.40]
        max_aggregate_size_cm: 2.54
        length_scale: 1.3
        cover_depth_range: [2.54, 3.81]
        visible_length_min_cm: 3.0
        visible_length_min_diameter_factor: 2.5
        secondary_layer_offset: 2.0
        dual_direction: true
        extent_padding: 0.5
        curve_enabled: true
        curve_offset_ratio_range: [0.15, 0.45]
        curve_normal_ratio: 0.25
        rib_enabled: true
        rib_spacing_diameter_factor: 1.2
        rib_band_diameter_factor: 0.5
        rib_height_ratio: 0.08
        rib_max_count: 8
