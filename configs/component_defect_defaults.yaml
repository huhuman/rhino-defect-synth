modeling:
  debug:
    defect_normals:
      enabled: false
      layer: "debug::normal"
      by_type: true
      length: 40.0
      head_length_ratio: 0.25
      head_width_ratio: 0.35
    defect_seeds:
      enabled: true
      layer: "debug::seed"
      by_type: true
      radius_coef: 0.04375
      min_radius: 0.625
      axis_scale: 1.6
  defect:
    enabled: true
    seed: null
    target_layers: ["component::slab", "component::parapet", "component::beam", "component::pier"]
    max_attempts_per_instance: 40
    reference:
      sample_count_u: 2
      sample_count_v: 2
      trim_margin: 0.1
      max_num_surfaces: 0
      min_boundary_distance: 20.0
    surface_subtraction:
      normal_extrude_distance: 8.0
    random:
      orientation_min_deg: 0.0
      orientation_max_deg: 360.0
      boundary_margin: 0.9
      normal_offset: 0.0
    layers:
      geometry:
        crack_cs1: "defect::crack::CS1"
        crack_cs2: "defect::crack::CS2"
        crack_cs3: "defect::crack::CS3"
        efflore_cs2: "defect::efflore::CS2"
        efflore_cs3: "defect::efflore::CS3"
        spall_cs2: "defect::spalling::CS2"
        spall_cs3: "defect::spalling::CS3"
        exposed_rebar_cs2: "defect::exposed_rebar::CS2"
        exposed_rebar_cs3: "defect::exposed_rebar::CS3"
    crack:
      enabled: true
      count: 0
      overview_csv_path: null
      cs_weights: [1, 1, 1]
      t1: 0.03048
      t2: 0.127
      d1_range: [0.05, 0.25]
      delta_depth_range: [1.0, 3.0]
    efflore:
      enabled: true
      count: 0
      overview_csv_path: null
      cs_weights: [1, 1]
      span_range_cm: [30.0, 100.0]
      fixed_thickness: 0.5
    spalling:
      enabled: true
      count: 0
      overview_csv_path: null
      depth_threshold: 2.54
      diameter_threshold: 15.24
      cs_weights: [1, 1]
      depth_irregularity: 0.2
      min_bottom_area_ratio: 0.25
      rebar_enabled: true
      rebar_probability: 0.5
      force_rebar: false
      rebar:
        rebar_count_range: [1, 3]
        rebar_radius_range: [0.8, 2.5]
        rebar_length_scale: 1.3
        rebar_cover_depth: 2.0
