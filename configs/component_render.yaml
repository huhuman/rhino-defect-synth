extends: component_base.yaml

modeling:
  strategy: component
  component:
    seed: null
    convert_polygons_to_surfaces: true
    keep_polygon_curves: false
    delete_centerline_curve: true
    centerline:
      span: 2133.6               # 70 ft
      num_base_pts: 3
      start_point: [0.0, 0.0, 0.0]
      use_curve: true
      theta_deg: null
      theta_deg_min: 75.0
      theta_deg_max: 105.0
    slab:
      width: 1200.0
      thickness: 25.0
      cross_slope_ratio: 0.015
    parapet:
      enabled: true
      h1: 10.16
      h2: 22.86
      h3: 95.25
      h4: 99.06
      w1: 76.2
      w2: 24.13
      w3: 19.05
    beam:
      enabled: true
      num_lines: 7
      section_key: "36 I-beam"
      section_library_inch: {}
    bearing:
      enabled: true
      thickness: 5.0
      base_norm_width: 120.0
      road_width_scale: 0.8
      mid_width_scale: 0.8
      mid_thickness_scale: 1.5
    pier:
      enabled: true
      type: "hammerhead"         # hammerhead | m_column
      H: 1200.0
      V: 500.0
      W: 100.0
      count: 1
      anchor_indices: null
      use_internal_stations_only: true
      hammerhead:
        slope_ratio: 0.125
        head_height_ratio: 0.15
        head_cap_section_height: 80.0
      m_column:
        cap_height: 99.06
        bottom_height: 152.4
        slope_ratio: 0.08333333333333333
        column_min_width: 91.44
        edge_offset: 213.36
    layers:
      slab: slab
      parapet: parapet
      beam: beam
      bearing: bearing
      pier: pier
    reference_points:
      enabled: true
      layers: [slab, parapet, beam, pier]
      sample_count_u: 1
      sample_count_v: 1
      trim_margin: 0.1
      max_num_surfaces: 0
      convert_polylines: true
      explode_polysurfaces: true
  damage:
    enabled: true
    seed: null
    record_output_path: "C:/path/to/your/component_rendered/defect_records/model_000.json"
    target_layers: [slab, parapet, beam, pier]
    shape_library:
      shape_dir: "C:/path/to/your/defect_shape_polygons"
      recursive: true
      pattern: "*.json"
      file_format: auto
    reference:
      sample_count_u: 2
      sample_count_v: 2
      trim_margin: 0.1
      min_boundary_distance: 20.0
      max_num_surfaces: 0
    random:
      scale_min: 0.6
      scale_max: 1.4
      orientation_min_deg: 0.0
      orientation_max_deg: 360.0
      boundary_margin: 0.9
      normal_offset: 0.0
    layers:
      seeds: "defects::seeds"
      geometry:
        crack: "defects::geometry::crack"
        efflore: "defects::geometry::efflore"
        spall: "defects::geometry::spall"
        rebar: "defects::geometry::rebar"
      mask:
        crack: "defects::mask::crack"
        efflore: "defects::mask::efflore"
        spall: "defects::mask::spall"
        rebar: "defects::mask::rebar"
        exposed_rebar: "defects::mask::exposed_rebar"
    crack:
      enabled: true
      count: 0
      d1_range: [0.5, 2.5]
      delta_depth_range: [10.0, 30.0]
    efflore:
      enabled: true
      count: 0
      thickness_range: [0.2, 1.5]
    exposed_rebar:
      enabled: true
      count: 0
      spall_depth_range: [5.0, 20.0]
      rebar_count_range: [1, 3]
      rebar_radius_range: [0.8, 2.5]
      rebar_length_scale: 1.3
      rebar_cover_depth: 2.0

rendering:
  width: 1920
  height: 1080
  output_dir: "C:/path/to/your/component_rendered"
  outputs:
    mask:
      # If `only_layers` is set, only these layers are visible for mask output.
      # only_layers:
      #   - "defects::mask::crack"
      #   - "defects::mask::efflore"
      hide_layers:
        - "crack_extrusion"
  camera:
    strategy: component
    component:
      cameras_per_defect: 3
      distance_min: 100.0
      distance_max: 200.0
      normal_jitter_degrees: 12.0
      tangent_jitter: 20.0
      target_jitter: 5.0
      direction_jitter_degrees: 2.0
      position_jitter: null
      position_jitter_scale: 0.0
      # Optional: auto-load camera seeds from damage placement records.
      # defect_record_path: "C:/path/to/your/component_rendered/defect_records/model_000.json"
      # defect_types: [crack, efflore, exposed_rebar]
      defects:
        - point: [0.0, 0.0, 0.0]
          normal: [0.0, 0.0, 1.0]
