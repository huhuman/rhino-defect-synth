view_setup:
  hide_layers:
    - "debug"

modeling:
  defect:
    enabled: true

rendering:
  width: 1920
  height: 1080
  match_viewport_aspect: true
  output_dir: "C:/path/to/your/component_rendered"
  channel:
    color: true
    depth: true
    normal: true
    depth_buffer: true
    normal_buffer: true
    mask: true
  outputs:
    scene:
      hide_layers:
        - "debug"
    mask:
      # If `only_layers` is set, only these layers are visible for mask output.
      # only_layers:
      #   - "defect::crack"
      #   - "defect::efflore"
      hide_layers:
        - "crack_extrusion"
  camera:
    strategy: component
    component:
      # Demo-only path controls used by main_demo.py / utils_loc.render_demo.
      # The component camera demo walks the scene AABB corners at mid-Z and closes the loop v3 -> v0.
      bbox_scale: 1.5
      smooth_path: false
      transition_frames: 0
      cameras_per_defect: 3
      distance_min: 100.0
      distance_max: 200.0
      normal_jitter_degrees: 12.0
      tangent_jitter: 20.0
      target_jitter: 5.0
      direction_jitter_degrees: 2.0
      position_jitter: null
      position_jitter_scale: 0.0
      # Optional: auto-load camera seeds from defect placement records.
      # defect_record_path: "C:/path/to/your/component_rendered/defect_records/model_000.json"
      # defect_types: [crack, efflore, spalling, exposed_rebar]
      # Optional inline camera seeds. Keep empty for normal defect-driven runs.
      # defects:
      #   - point: [0.0, 0.0, 0.0]
      #     normal: [0.0, 0.0, 1.0]
      defects: []
