view_setup:
  hide_layers:
    - "debug"

modeling:
  defect:
    enabled: true

nested_loop:
  seed: null
  max_iter: 1
  renders_per_model: 2
  output_index_start: 0
  reapply_texture_mapping_per_render: true
  stability:
    enabled: true
    wait_after_reset_ms: 20
    wait_after_preparation_ms: 40
    wait_before_render_ms: 40
    wait_after_render_ms: 60
    wait_after_capture_frame_ms: 0
    wait_on_retry_ms: 400
    gc_every_capture_frames: 8
    render_retry_count: 1
    gc_every_render_passes: 1
    gc_every_model_iters: 1
    clear_undo_every_render_passes: 1
    clear_undo_every_model_iters: 1
    max_private_memory_mb: 0.0
    max_render_passes_per_run: 0
    max_basic_materials: 0
    log_memory: true
  # Set to false to disable per-model geometry randomization in main_component_batch.py.
  component_sampler:
    centerline:
      # Discrete stationing presets instead of continuous jitter.
      span: [1828.8, 2133.6, 2438.4]
      num_base_pts: [3, 4, 5]
    slab:
      width: [1097.28, 1219.2, 1341.12]
      thickness: [22.86, 25.4, 27.94]
    beam:
      # Standardized beam section families; choose one per model_iter.
      section_key: [
        "36 I-beam",
        "42 I-beam",
        "48 I-beam",
        "54 I-beam",
        "63 bulb_t-beam",
        "72 bulb_t-beam",
        "36A IL-beam",
        "45A IL-beam",
        "54A IL-beam",
        "36B IL-beam",
        "45B IL-beam",
      ]
    pier:
      # Presets keep type/dimensions coupled instead of mixing arbitrary ranges.
      - {type: "hammerhead", H: 1097.28, V: 457.2, W: 137.16}
      - {type: "hammerhead", H: 1417.32, V: 609.6, W: 152.4}
      - {type: "m_column", H: 1219.2, V: 609.6, W: 152.4}
      - {type: "m_column", H: 1341.12, V: 762.0, W: 182.88}
  # Random overrides merged into rendering once per render_iter.
  rendering_sampler: {}

rendering:
  width: 1920
  height: 1080
  match_viewport_aspect: true
  output_dir: "C:/path/to/your/component_rendered"
  lighting:
    sun:
      enabled: true
      time_of_day: null
      intensity: 1.0
    skylight:
      enabled: true
      intensity: 0.25
  channel:
    color: true
    depth: true
    normal: true
    depth_buffer: true
    normal_buffer: true
    mask: true
  outputs:
    scene:
      hide_layers:
        - "debug"
    mask:
      # If `only_layers` is set, only these layers are visible for mask output.
      # only_layers:
      #   - "defect::crack"
      #   - "defect::efflore"
      hide_layers:
        - "crack_extrusion"
  camera:
    strategy: component
    component:
      # Demo-only path controls used by main_demo.py / utils_loc.render_demo.
      # The component camera demo walks the scene AABB corners at mid-Z and closes the loop v3 -> v0.
      bbox_scale: 1.5
      smooth_path: false
      transition_frames: 0
      sample_count: 3
      direction_jitter_degrees: 5.0
      distance_ranges:
        crack: [50.0, 150.0]
        efflore: [150.0, 500.0]
        spalling: [150.0, 500.0]
        exposed_rebar: [150.0, 500.0]
        default: [150.0, 500.0]
      # Auto-load camera seeds from Rhino document defect metadata.
      # defect_types: [crack, efflore, spalling, exposed_rebar]
      # Optional inline camera seeds. Keep empty for normal defect-driven runs.
      # defects:
      #   - point: [0.0, 0.0, 0.0]
      #     normal: [0.0, 0.0, 1.0]
      defects: []

preparation:
  autosave:
    disable_during_batch: true
  undo:
    disable_during_batch: true
