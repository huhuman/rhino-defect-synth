extends: component_base.yaml

modeling:
  strategy: component

rendering:
  width: 1920
  height: 1080
  output_dir: "C:/path/to/your/component_rendered"
  camera:
    strategy: component
    component:
      cameras_per_defect: 3
      distance_min: 100.0
      distance_max: 200.0
      normal_jitter_degrees: 12.0
      tangent_jitter: 20.0
      target_jitter: 5.0
      direction_jitter_degrees: 2.0
      position_jitter: null
      position_jitter_scale: 0.0
      defects:
        - point: [0.0, 0.0, 0.0]
          normal: [0.0, 0.0, 1.0]
