view_setup:
  only_layers:
    - "cube"
    - "crack"
  hide_layers: []

nested_loop:
  seed: null
  renders_per_model: 1
  max_iter: null
  camera_arrangements: null
  output_index_start: 0
  preparation_scope: arrangement
  rendering_sampler: {}
  stability:
    enabled: true
    wait_after_reset_ms: 20
    wait_after_preparation_ms: 40
    wait_before_render_ms: 40
    wait_after_render_ms: 60
    wait_after_capture_frame_ms: 0
    wait_on_retry_ms: 400
    gc_every_capture_frames: 8
    render_retry_count: 1
    gc_every_render_passes: 1
    gc_every_model_iters: 1
    clear_undo_every_render_passes: 1
    clear_undo_every_model_iters: 1
    max_private_memory_mb: 0.0
    max_render_passes_per_run: 0
    max_basic_materials: 0
    log_memory: true

rendering:
  width: 1920
  height: 1080
  match_viewport_aspect: true
  output_dir: "C:/path/to/your/rendered"
  background_wallpaper_dir: "C:/path/to/your/background_wallpapers"
  channel:
    color: true
    depth: true
    normal: true
    depth_buffer: true
    normal_buffer: true
    mask: true
  outputs:
    scene: {}
    mask: {}
  lighting:
    # Sun is still configurable; face lights are randomized in code.
    sun:
      enabled: true
      time_of_day: null       # null -> random 5–19 inside code
      intensity: 0.25
  camera:
    strategy: cube
    cube:
      arrangement: grid            # grid | spherical
      points_per_side: 2           # Used by arrangement=grid
      sample_count: 24             # Used by arrangement=spherical
      distance_multiplier_min: 1.5
      distance_multiplier_max: 2.5
      sphere_angle_jitter_degrees: 0.0
      direction_jitter_degrees: 25.0  # Camera look-direction randomness in degrees.
      position_jitter: null           # Absolute position jitter (model units). null -> use scale below.
      position_jitter_scale: 0.25     # Multiplied by pose spacing when position_jitter is null.
    transition_frames: 5
    smooth_path: false
