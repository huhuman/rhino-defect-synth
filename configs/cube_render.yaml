extends: cube_base.yaml
modeling:
  strategy: cube
  cube_map_dir: "C:/path/to/your/crack_cube_maps"
rendering:
  width: 1920
  height: 1080
  output_dir: "C:/path/to/your/rendered"
  background_wallpaper_dir: "C:/path/to/your/background_wallpapers"
  lighting:
    # Sun is still configurable; face lights are randomized in code.
    sun:
      enabled: true
      time_of_day: null       # null -> random 5–19 inside code
      intensity: 0.25
  camera:
    points_per_side: 2
    distance_multiplier_min: 1.5
    distance_multiplier_max: 2.5
    direction_jitter_degrees: 25.0  # Camera look-direction randomness in degrees.
    position_jitter: null           # Absolute position jitter (model units). null -> use scale below.
    position_jitter_scale: 0.25     # Multiplied by grid spacing when position_jitter is null.
    transition_frames: 5
    smooth_path: false
